services:
  - type: web
    name: sentriq-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up

    envVars:
      - key: RAILS_MASTER_KEY
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: sentriq-postgres
          property: connectionString

      - key: RAILS_ENV
        value: production

      - key: RAILS_SERVE_STATIC_FILES
        value: "true"

      - key: GROQ_API_KEY
        sync: false

      - key: GROK_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: RAGIE_API_KEY
        sync: false

databases:
  - name: sentriq-postgres
    plan: free
    region: frankfurt
    databaseName: sentriq_ai_production
    user: sentriq